openapi: 3.0.3
info:
  title: Email Validation API
  version: 1.0.0
  description: Validate an email address - syntax, MX records, disposable domains, role accounts, free providers, typo suggestions, and a 0-100 deliverability score. No SMTP probing.
servers:
  - url: https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev
paths:
  /validate:
    get:
      operationId: validateEmail
      summary: Validate a single email address
      description: Returns syntax validity, MX/DNS check, disposable and role-account flags, free-provider flag, a typo suggestion and a 0-100 score.
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string }
          example: test@gmail.com
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Missing email
  /validate/batch:
    post:
      operationId: validateEmailBatch
      summary: Validate up to 25 email addresses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emails:
                  type: array
                  maxItems: 25
                  items: { type: string }
              required: [emails]
            example: { "emails": ["test@gmail.com", "bob@mailinator.com"] }
      responses:
        "200":
          description: Array of validation results
          content:
            application/json:
              schema: { type: object }
